<!doctype html>
<html lang="{{ lang or 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="robots" content="noindex,nofollow">
  <title>Relay Core</title>
  {% for script in relay_preloads %}<link rel="modulepreload" href="{{ script | e }}">{% endfor %}
  {% for stylesheet in relay_styles %}<link rel="stylesheet" href="{{ stylesheet | e }}">{% endfor %}
</head>
<body>
  <div id="app" data-csrf="{{ relay_csrf | e }}" data-user="{{ relay_user | e }}" data-capabilities="{{ relay_capabilities | e }}" data-site="{{ relay_site | e }}" data-socket-port="{{ relay_socket_port | e }}"></div>
  <script type="module" src="{{ relay_script | e }}"></script>
</body>
</html>
