; Relay AI service for one bench. Replace BENCH_PATH, BENCH_USER and WEB_PORT (the bench webserver_port, 8000 by
; default), copy into the bench's config/supervisor.conf or /etc/supervisor/conf.d/, then run
; `sudo supervisorctl reread && sudo supervisorctl update`.
[program:relay-ai-service]
command=BENCH_PATH/env/bin/python -m relay_core.ai.remote.daemon --sites BENCH_PATH/sites --callback http://127.0.0.1:WEB_PORT
directory=BENCH_PATH/sites
user=BENCH_USER
priority=4
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=40
redirect_stderr=true
stdout_logfile=BENCH_PATH/logs/relay-ai-service.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
