[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frappe-relay-core"
version = "0.1.0"
description = "Relay Core communication services and Frappe frontend foundation"
requires-python = ">=3.11"
dependencies = ["weasyprint>=68,<69"]

[tool.setuptools.packages.find]
include = ["relay_core*"]

[tool.setuptools.package-data]
relay_core = ["modules.txt", "**/*.json", "**/*.js", "www/*.html", "public/relay/**/*", "public/images/*", "public/relay/.vite/*.json"]
